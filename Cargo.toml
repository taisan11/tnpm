[package]
name = "tnpm"
version = "0.4.3"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23"
colored = "3.1.1"
const-hex = "1"
dirs = "7"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
glob = "0.3.4"
ignore = "0.4"
libc = "0.2"
mimalloc = "0.1.52"
nojson = "0.3.15"
oxc_allocator = "0.159"
oxc_ast = "0.159"
oxc_codegen = { version = "0.159", default-features = false }
oxc_parser = "0.159"
oxc_resolver = "11.24"
oxc_semantic = "0.159"
oxc_span = "0.159"
oxc_transformer = "0.159"
phf = { version = "0.14", features = ["macros"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
rpassword = "7"
rustc-hash = "2.1"
self-replace = "1.5.1"
semver = "1"
sha1 = "0.11"
sha2 = "0.11"
simdutf8 = "0.1.5"
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
unicode-width = { version = "0.2", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
