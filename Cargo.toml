[package]
name = "tnpm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
colored = "3.1.1"
dirs = "7"
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
libc = "0.2"
mimalloc = "0.1.52"
noargs = "0.4.3"
nojson = "0.3.15"
phf = { version = "0.14", features = ["macros"] }
reqwest = { version = "0.13", features = ["gzip", "brotli", "deflate", "zstd"] }
rustc-hash = "2.1"
sha1 = "0.10"
sha2 = "0.10"
simdutf8 = "0.1.5"
tar = "0.4"
tokio = { version = "1", default-features = false, features = ["rt"] }
unicode-width = { version = "0.2", default-features = false }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
